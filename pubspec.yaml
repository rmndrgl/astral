name: astral

description: "Astral dreams project!"

version: 1.3.0+0

environment:

  sdk: ^3.13.5

dependencies:

  flutter:
    sdk: flutter

  material_ui: ^1.11.1
  cupertino_icons: ^2.0.0
  local_auth: ^3.0.2
  overlay_support: ^2.1.0
  sqflite: ^2.4.4+1
  path: ^1.9.1
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  intl: ^0.20.3
  file_picker: ^13.4.0

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 35
